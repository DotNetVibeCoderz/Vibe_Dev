# Overlay: SQL Server storage.
services:
  marbots:
    environment:
      Marbots__Database__Provider: sqlserver
      Marbots__Database__ConnectionString: Server=sqlserver,1433;Database=master;User ID=sa;Password=${MSSQL_SA_PASSWORD:-Marbots!Change-Me1};TrustServerCertificate=true
    depends_on:
      sqlserver: { condition: service_healthy }
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Marbots!Change-Me1}
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 20
    restart: unless-stopped
volumes:
  sqlserver-data:
