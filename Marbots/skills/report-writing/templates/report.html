<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
  :root { --ink:#1b2236; --muted:#5b6478; --line:#d9deea; --accent:#2f45c9; }
  body { font: 16px/1.6 "Segoe UI", system-ui, sans-serif; color: var(--ink); max-width: 72ch; margin: 3rem auto; padding: 0 1rem; }
  h1 { font-size: 2rem; line-height: 1.2; margin-bottom: .25rem; }
  .meta { color: var(--muted); margin-bottom: 2rem; }
  table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
  th, td { border-bottom: 1px solid var(--line); padding: .5rem; text-align: left; }
  .summary { border-left: 4px solid var(--accent); padding: .5rem 1rem; background: #f4f6fb; }
  @media print { body { margin: 0; } }
</style>
</head>
<body>
<h1>{{title}}</h1>
<p class="meta">{{date}} · {{author}}</p>
<section class="summary">{{executive_summary}}</section>
{{body}}
</body>
</html>
