[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marbots-sdk"
version = "0.3.0"
description = "Typed Python SDK for Marbots, the multi-agent collaboration platform (Boss Man orchestration, per-bot models, skills, MCP, A2A). By Gravicode Studios, led by Kang Fadhil."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Gravicode Studios (Kang Fadhil)" }]
keywords = ["ai", "agents", "multi-agent", "llm", "orchestration", "mcp", "a2a", "marbots"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Typing :: Typed",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/DotNetVibeCoderz/Vibe_Dev/tree/main/Marbots"
Repository = "https://github.com/DotNetVibeCoderz/Vibe_Dev"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
marbots_sdk = ["py.typed"]
