# Marbots — CI and release (Gravicode Studios, led by Kang Fadhil)
#  • Every push/PR touching Marbots/: build + .NET tests (incl. .NET SDK conformance) + SDK checks
#    (Python: mypy --strict + typo test + conformance; TypeScript: typo test + conformance; Go: vet + build)
#    plus Java (javac -Werror + conformance) and Rust (fmt + clippy -D warnings + conformance)
#  • Storage conformance also runs against PostgreSQL, MySQL and SQL Server service containers
#  • Tag "marbots-v*" (e.g. marbots-v0.1.1) or manual run with publish=true: pack and push NuGet packages
#    (uses the repository secret NUGET_API_KEY)
#  • Tag "marbots-v*": marbots-host binaries for 6 platforms + CycloneDX SBOMs + SHA256SUMS on the GitHub release
#  • Java SDK: JitPack builds tags marbots-java-v* (see /jitpack.yml). Manual run with publish_maven=true publishes to
#    Maven Central once the com.gravicode namespace is verified for the MAVEN_CENTRAL_* account
name: Marbots

on:
  push:
    branches: [main]
    paths: ["Marbots/**", ".github/workflows/marbots.yml"]
    tags: ["marbots-v*"]
  pull_request:
    paths: ["Marbots/**", ".github/workflows/marbots.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish NuGet packages (Marbots.Abstractions, Marbots.Sdk, Marbots.Cli)"
        type: boolean
        default: false
      publish_maven:
        description: "Publish the Java SDK (com.gravicode:marbots-sdk) to Maven Central"
        type: boolean
        default: false

defaults:
  run:
    working-directory: Marbots

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: marbots, POSTGRES_DB: marbots_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: marbots, MYSQL_DATABASE: marbots_test }
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -pmarbots" --health-interval 5s --health-timeout 5s --health-retries 30
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env: { ACCEPT_EULA: "Y", MSSQL_SA_PASSWORD: "Marbots!Test1" }
        ports: ["1433:1433"]
    env:
      MARBOTS_TEST_POSTGRES: "Host=localhost;Port=5432;Database=marbots_test;Username=postgres;Password=marbots"
      MARBOTS_TEST_MYSQL: "Server=localhost;Port=3306;Database=marbots_test;User ID=root;Password=marbots;AllowUserVariables=true"
      MARBOTS_TEST_SQLSERVER: "Server=localhost,1433;Database=master;User ID=sa;Password=Marbots!Test1;TrustServerCertificate=true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }

      - name: Build
        run: dotnet build Marbots.slnx -c Debug
      - name: .NET tests (runtime, engine, models, approvals, .NET SDK conformance)
        run: dotnet test tests/Marbots.Tests --no-build -c Debug
      - name: Python SDK static typing (mypy --strict, typos rejected)
        working-directory: Marbots/sdk/python
        run: pip install -q mypy && python tests/typecheck/run.py
      - name: Python SDK conformance
        working-directory: Marbots/sdk/python/tests
        run: PYTHONPATH=../src python -m unittest -v
      - name: TypeScript SDK (typo test + conformance)
        working-directory: Marbots/sdk/typescript
        run: npm ci && npm run build && npm test
      - name: Go SDK (vet + conformance)
        working-directory: Marbots/sdk/go
        run: go vet ./... && go test ./...
      - name: Java SDK (javac -Werror + conformance)
        working-directory: Marbots/sdk/java
        run: |
          mkdir -p target/classes target/test-classes
          javac --release 17 -Xlint:all -Werror -d target/classes $(find src/main -name "*.java")
          javac --release 17 -d target/test-classes -cp target/classes $(find src/test -name "*.java")
          java -cp target/classes:target/test-classes com.gravicode.marbots.ConformanceTest
      - name: Rust SDK (fmt + clippy + conformance)
        working-directory: Marbots/sdk/rust
        run: cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test

  release-assets:
    needs: test
    if: startsWith(github.ref, 'refs/tags/marbots-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: marbots-host binaries
        run: |
          mkdir -p dist
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            dotnet publish src/Marbots.AgentHost -c Release -r $rid --self-contained -p:PublishSingleFile=true -o out/$rid
            ext=""; [[ $rid == win-* ]] && ext=".exe"
            cp out/$rid/marbots-host$ext dist/marbots-host-$rid$ext
          done
      - name: SBOMs (CycloneDX)
        run: |
          dotnet tool install --global CycloneDX
          dotnet-CycloneDX Marbots.slnx -o dist -fn marbots-dotnet.cdx.json -F Json -ed
          (cd sdk/typescript && npm ci && npx --yes @cyclonedx/cyclonedx-npm --output-file ../../dist/marbots-typescript-sdk.cdx.json)
          python -m venv /tmp/sdkenv && /tmp/sdkenv/bin/pip install -q ./sdk/python
          pip install -q cyclonedx-bom && cyclonedx-py environment /tmp/sdkenv/bin/python -o dist/marbots-python-sdk.cdx.json
      - name: Checksums and release upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum * > SHA256SUMS && cd ..
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Marbots ${GITHUB_REF_NAME#marbots-v}" --notes "See Marbots/Progress.md"
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  nuget:
    needs: test
    if: startsWith(github.ref, 'refs/tags/marbots-v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/marbots-v* ]]; then echo "version=${GITHUB_REF_NAME#marbots-v}" >> "$GITHUB_OUTPUT";
          else echo "version=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)" >> "$GITHUB_OUTPUT"; fi
      - name: Pack
        run: |
          for p in Marbots.Abstractions Marbots.Sdk Marbots.Cli; do
            dotnet pack src/$p -c Release -o nupkgs -p:Version=${{ steps.version.outputs.version }}
          done
      - uses: actions/upload-artifact@v4
        with: { name: marbots-nuget, path: Marbots/nupkgs }
      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "nupkgs/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  maven:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.publish_maven
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Marbots/sdk/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Publish to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: bash publish-central.sh
