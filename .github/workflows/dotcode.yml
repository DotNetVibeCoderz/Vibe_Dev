# DotCode — CI and release (Gravicode Studios, led by Kang Fadhil)
#  • Every push/PR touching DotCode/: build + .NET tests + SDK conformance tests (TypeScript, Python, Go, Java)
#  • Tag "dotcode-v*" (e.g. dotcode-v0.1.0) or manual run with publish=true: NativeAOT binaries + NuGet publish
#    (uses the repository secret NUGET_API_KEY)
name: DotCode

on:
  push:
    branches: [main]
    paths: ["DotCode/**", ".github/workflows/dotcode.yml"]
    tags: ["dotcode-v*"]
  pull_request:
    paths: ["DotCode/**", ".github/workflows/dotcode.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish packages to NuGet"
        type: boolean
        default: false
      publish_maven:
        description: "Publish the Java SDK to Maven Central"
        type: boolean
        default: false
      build_binaries:
        description: "Build all release binaries, checksums and SBOM as workflow artifacts (no publishing)"
        type: boolean
        default: false
      publish_vscode:
        description: "Publish the VS Code extension (version from ide/vscode/package.json) to the Marketplace"
        type: boolean
        default: false

defaults:
  run:
    working-directory: DotCode

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: DotCode/global.json
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }

      - name: Build
        run: dotnet build DotCode.slnx -c Debug
      - name: Install bubblewrap (runs the Linux sandbox test for real)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor; allow them on the CI runner.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-net --die-with-parent -- /bin/true && echo "bubblewrap OK"
      - name: Install a language server (runs the LSP tool test against a real server)
        run: npm i -g typescript@5 typescript-language-server
      - name: .NET tests (provider contracts, engine, TUI, SDK conformance)
        run: dotnet test tests/DotCode.Tests --no-build -c Debug
        env:
          DOTCODE_REQUIRE_SANDBOX: "1"
          DOTCODE_REQUIRE_LSP: "1"
      - name: TypeScript SDK
        working-directory: DotCode/sdk/typescript
        run: npm ci && npm run build && npm test
      - name: Python SDK
        working-directory: DotCode/sdk/python/tests
        run: PYTHONPATH=../src python -m unittest -v
      - name: Python SDK static typing (mypy --strict, typos rejected)
        working-directory: DotCode/sdk/python
        run: pip install -q mypy pydantic && python tests/typecheck/run.py
      - name: Go SDK
        working-directory: DotCode/sdk/go
        run: go vet ./... && go test ./...
      - name: Java SDK
        working-directory: DotCode/sdk/java
        run: |
          mkdir -p target/classes target/test-classes
          javac --release 17 -Xlint:all -Werror -d target/classes $(find src/main -name "*.java")
          javac --release 17 -d target/test-classes -cp target/classes $(find src/test -name "*.java")
          java -cp target/classes:target/test-classes com.gravicode.dotcode.ConformanceTest
      - name: Installer test (install.sh against a fake release)
        run: sh install/test-install.sh
      - name: Rust SDK
        working-directory: DotCode/sdk/rust
        run: cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test
      - name: Rust SDK sample (build)
        working-directory: DotCode/samples/sdk/rust
        run: cargo build
      - name: VS Code extension (integration tests inside VS Code, then VSIX)
        working-directory: DotCode/ide/vscode
        run: |
          npm ci
          npm run typecheck
          xvfb-run -a npm test
          # Release builds carry the DotCode version (the Marketplace needs a new version for every publish).
          if [[ "$GITHUB_REF" == refs/tags/dotcode-v* ]]; then npm version "${GITHUB_REF_NAME#dotcode-v}" --no-git-tag-version --allow-same-version; fi
          npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: DotCode/ide/vscode/dotcode-vscode.vsix

  sandbox-macos:
    # The shell sandbox uses sandbox-exec (Seatbelt) on macOS: run its tests for real on a macOS runner.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: DotCode/global.json
      - name: Sandbox tests (Seatbelt)
        run: dotnet test tests/DotCode.Tests -c Debug --filter "FullyQualifiedName~SandboxTests"
        env:
          DOTCODE_REQUIRE_SANDBOX: "1"
      - name: Installer test (install.sh on macOS)
        run: sh install/test-install.sh

  binaries:
    needs: test
    if: startsWith(github.ref, 'refs/tags/dotcode-v') || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.build_binaries))
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners where available; Linux builds use 22.04 so the binaries run on glibc >= 2.35.
          - { os: windows-latest, rid: win-x64 }
          - { os: windows-11-arm, rid: win-arm64 }
          - { os: ubuntu-22.04, rid: linux-x64 }
          - { os: ubuntu-22.04-arm, rid: linux-arm64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-latest, rid: osx-x64 }     # cross-compiled; smoke-tested under Rosetta
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: DotCode/global.json
      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/dotcode-v* ]]; then v="${GITHUB_REF_NAME#dotcode-v}"
          else v="$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props 2>/dev/null || sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)-ci.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building DotCode $v"
      - name: Linux toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang zlib1g-dev
      - name: NativeAOT publish
        shell: bash
        run: dotnet publish src/DotCode.Cli -c Release -r ${{ matrix.rid }} -o out/${{ matrix.rid }} -p:DebugType=none -p:Version=${{ steps.version.outputs.version }}
      - name: Smoke test
        shell: bash
        env:
          DOTCODE_CONFIG_DIR: ${{ runner.temp }}/dotcode-cfg
        run: |
          exe=./out/${{ matrix.rid }}/dotcode
          run() { if [ "${{ matrix.rid }}" = osx-x64 ]; then arch -x86_64 "$@"; else "$@"; fi; }
          run $exe --version
          run $exe --version | grep -q "${{ steps.version.outputs.version }}"
          run $exe -p "hello" --model mock:echo < /dev/null | grep -q "Echo: hello"
      - name: Package
        shell: bash
        run: |
          mkdir -p pkg dist
          # Only the executable (publish also leaves .pdb / .dbg / .dSYM debug symbols next to it).
          if [[ "${{ matrix.rid }}" == win-* ]]; then cp out/${{ matrix.rid }}/dotcode.exe pkg/; else cp out/${{ matrix.rid }}/dotcode pkg/; fi
          cp README.md LICENSE pkg/
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            pwsh -NoProfile -Command "Compress-Archive -Path pkg/* -DestinationPath dist/dotcode-${{ matrix.rid }}.zip"
          else
            chmod 755 pkg/dotcode
            tar -czf dist/dotcode-${{ matrix.rid }}.tar.gz -C pkg .
          fi
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: dotcode-${{ matrix.rid }}
          path: DotCode/dist/*

  assets:
    # Collects the archives, writes SHA256SUMS and an SPDX SBOM; release builds also get build-provenance attestations.
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dotcode-*
          path: assets
          merge-multiple: true
      - name: Installer test (install.sh against a fake release)
        run: sh install/test-install.sh
      - name: Checksums
        working-directory: assets
        run: |
          sha256sum dotcode-* > SHA256SUMS
          cat SHA256SUMS
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: DotCode
          format: spdx-json
          output-file: assets/dotcode-sbom.spdx.json
          upload-artifact: false
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/dotcode-v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            assets/dotcode-*.zip
            assets/dotcode-*.tar.gz
      - name: Add installers
        run: cp DotCode/install/install.sh DotCode/install/install.ps1 assets/
        working-directory: .
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: assets/*

  nuget:
    needs: test
    if: startsWith(github.ref, 'refs/tags/dotcode-v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: DotCode/global.json
      - name: Pack
        run: |
          for p in Abstractions Providers Engine Protocol Tui Sdk; do
            dotnet pack src/DotCode.$p -c Release -o nupkgs
          done
          dotnet pack src/DotCode.Cli -c Release -p:DotCodeTool=true -o nupkgs
          ls -la nupkgs
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: DotCode/nupkgs/*.nupkg
      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "nupkgs/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  maven:
    needs: test
    # Runs on release tags or manually. Requires a verified namespace in the Central Portal plus the secrets
    # MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD / GPG_PRIVATE_KEY / GPG_PASSPHRASE.
    if: startsWith(github.ref, 'refs/tags/dotcode-v') || (github.event_name == 'workflow_dispatch' && inputs.publish_maven)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Publish to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: bash sdk/java/publish-central.sh

  vscode-marketplace:
    # Publishes the VSIX that passed the integration tests. Needs the repository secret VSCE_PAT (Azure DevOps PAT with
    # Marketplace › Manage for the GravicodeStudios publisher). Independent of the release job so a Marketplace hiccup
    # never blocks binaries or NuGet.
    needs: test
    if: startsWith(github.ref, 'refs/tags/dotcode-v') || (github.event_name == 'workflow_dispatch' && inputs.publish_vscode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: vscode-extension, path: vsix }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Publish to the Visual Studio Marketplace
        working-directory: vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          npx --yes @vscode/vsce@3 verify-pat GravicodeStudios
          npx --yes @vscode/vsce@3 publish --packagePath dotcode-vscode.vsix --skip-duplicate

  release:
    needs: [assets, nuget]
    if: startsWith(github.ref, 'refs/tags/dotcode-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with: { name: release-assets, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: nuget-packages, path: dist/nuget }
      - uses: actions/download-artifact@v4
        with: { name: vscode-extension, path: dist/vscode }
      - name: Release notes
        run: |
          v="${GITHUB_REF_NAME#dotcode-v}"
          cat > notes.md <<EOF
          ## Install DotCode $v

          **macOS / Linux**
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/DotCode/install/install.sh | sh
          \`\`\`
          **Windows (PowerShell)**
          \`\`\`powershell
          irm https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/DotCode/install/install.ps1 | iex
          \`\`\`
          **.NET tool:** \`dotnet tool install -g DotCode.Cli\` · **Update:** \`dotcode update\`

          **VS Code extension:** \`code --install-extension GravicodeStudios.dotcode-vscode\` (Marketplace), or \`dotcode-vscode.vsix\` below.

          Every archive is listed in \`SHA256SUMS\` (the installers and \`dotcode update\` verify it) and has a build-provenance
          attestation: \`gh attestation verify dotcode-linux-x64.tar.gz --repo ${GITHUB_REPOSITORY}\`. SBOM: \`dotcode-sbom.spdx.json\`.

          *Built by Gravicode Studios, led by Kang Fadhil.*
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          name: DotCode ${{ github.ref_name }}
          body_path: notes.md
          files: |
            dist/dotcode-*.zip
            dist/dotcode-*.tar.gz
            dist/SHA256SUMS
            dist/dotcode-sbom.spdx.json
            dist/install.sh
            dist/install.ps1
            dist/nuget/*.nupkg
            dist/vscode/*.vsix
