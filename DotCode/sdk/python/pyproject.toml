[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dotcode-sdk"
version = "0.1.0"
description = "Python SDK for DotCode — embed a multi-LLM coding agent (Anthropic, OpenAI, Azure, Gemini, DeepSeek, Ollama) in your app. By Gravicode Studios, led by Kang Fadhil."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Gravicode Studios (Kang Fadhil)" }]
keywords = ["ai", "agent", "coding-agent", "llm", "claude", "openai", "gemini", "deepseek", "ollama", "mcp", "dotcode"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Framework :: AsyncIO",
  "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/DotNetVibeCoderz/Vibe_Dev"
Repository = "https://github.com/DotNetVibeCoderz/Vibe_Dev"

[tool.setuptools.packages.find]
where = ["src"]
